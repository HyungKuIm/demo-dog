plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.oraclejava'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ---- Next.js frontend ----
// ./gradlew deployFrontend : Next.js(standalone)를 빌드해서 ./frontend 로 복사
// 이후 bootRun / java -jar 로 Spring(8080)과 Next.js(3000)가 함께 실행됨 (NextJsServer)
def frontendSourceDir = file(findProperty('frontendSourceDir') ?: '../../route-handlers-demo')
def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('installFrontend', Exec) {
	group = 'frontend'
	description = 'Installs Next.js dependencies (npm ci).'
	workingDir = frontendSourceDir
	commandLine npmCommand, 'ci'
	inputs.file(new File(frontendSourceDir, 'package-lock.json'))
	outputs.dir(new File(frontendSourceDir, 'node_modules'))
}

tasks.register('buildFrontend', Exec) {
	group = 'frontend'
	description = 'Builds the Next.js app as a standalone server.'
	dependsOn 'installFrontend'
	workingDir = frontendSourceDir
	commandLine npmCommand, 'run', 'build'
}

tasks.register('deployFrontend', Sync) {
	group = 'frontend'
	description = 'Copies the Next.js standalone build into ./frontend.'
	dependsOn 'buildFrontend'
	into layout.projectDirectory.dir('frontend')
	from(new File(frontendSourceDir, '.next/standalone'))
	from(new File(frontendSourceDir, '.next/static')) { into '.next/static' }
	from(new File(frontendSourceDir, 'public')) { into 'public' }
}
