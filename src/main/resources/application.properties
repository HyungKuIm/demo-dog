spring.application.name=demo-dog

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dbdemoboot}?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:demoboot}
spring.datasource.password=${DB_PASSWORD:demo1234}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Image upload: files are saved to ./images and served at /images/**
demodog.image-dir=images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Return errors as RFC 9457 problem details so the reason (e.g. why an upload was rejected) is in the response
spring.mvc.problemdetails.enabled=true

# Next.js frontend: `./gradlew deployFrontend` copies the standalone build into ./frontend,
# and Spring starts it (node server.js) on this port after startup and stops it on shutdown
demodog.frontend.enabled=true
demodog.frontend.dir=frontend
demodog.frontend.port=3000
demodog.frontend.node=node
